</style>

create or replace function public.is_admin() returns boolean language sql stable security definer set search_path=public as $$ select exists(select 1 from public.admins where user_id=auth.uid()) $$;

begin
 if auth.uid() is not null and not public.is_admin() then
  new.id:=old.id; new.phone:=old.phone; new.status:=old.status; new.paid_until:=old.paid_until; new.verified:=old.verified;

end $$;

  const m=String((e&&e.message)||e||'');
  if(/Invalid login/i.test(m))return 'الرقم أو كلمة السر غلط';
  if(/already registered|already exists/i.test(m))return 'الرقم ده مسجّل قبل كده. اعمل تسجيل دخول';
  if(/at least 6|weak/i.test(m))return 'كلمة السر لازم تكون 6 حروف أو أرقام على الأقل';
  if(/rate limit|too many/i.test(m))return 'محاولات كتير. استنى شوية وجرب تاني';
  if(/row-level security|permission denied|policy/i.test(m))return 'مفيش صلاحية للعملية دي (لو اشتراكك منتهي جدّده)';
  if(/Failed to fetch|NetworkError/i.test(m))return 'مفيش اتصال بالإنترنت';
  return 'حصل خطأ: '+m;
}

/* ================= الصور ================= */
async function toBlob(file,max,q,type){
  try{
    let bmp=null;
    if(window.createImageBitmap){try{bmp=await createImageBitmap(file)}catch(e){bmp=null}}
    if(!bmp)bmp=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('decode'));im.src=u});
    const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,k=Math.min(1,max/Math.max(w,h));
    const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b),type||'image/jpeg',q));
  }catch(e){
    if(/^image\/(jpeg|png|webp|gif)$/.test(file.type)&&file.size<10*1024*1024)return file;
    return null;
  }
}
async function upImage(file,max,q,type){
  if(!me){toast('سجّل دخول الأول');return null}
  const blob=await toBlob(file,max,q,type);
  if(!blob){toast('الصورة دي مش مدعومة. جرب JPG أو PNG');return null}
  const ext=blob.type==='image/png'?'png':'jpg';
  const path=`${me.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const r=await sb.storage.from('media').upload(path,blob,{contentType:blob.type||'image/jpeg',upsert:false});
  if(r.error){toast('رفع الصورة فشل: '+errMsg(r.error));return null}
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}
function imgsHTML(){
  return tmp.imgs.map((s,i)=>`<div class="th"><img src="${esc(s)}" alt=""><div class="thb">${i===0?'<span>رئيسية</span>':`<button type="button" onclick="mainImg(${i})">رئيسية</button>`}<button type="button" onclick="rmImg(${i})">✕</button></div></div>`).join('')+
  (tmp.imgs.length<6?`<label class="addimg">+ صور<input type="file" accept="image/*" multiple onchange="addImgs(this)"></label>`:'');

async function addImgs(inp){

  return `<div class="panel"><label class="f" for="in">اسم المصنع</label><input id="in" value="${esc(f.name)}">
  <div class="row"><div><label class="f" for="ic">المدينة</label><input id="ic" value="${esc(f.city)}"></div><div><label class="f" for="iw">رقم الواتساب للطلبات</label><input id="iw" inputmode="tel" value="${esc(f.whatsapp||f.phone)}"></div></div>
  <label class="f" for="id">نبذة</label><textarea id="id">${esc(f.descr)}</textarea>
  <div class="bar"><button class="btn" onclick="saveInfo()">حفظ</button></div></div>`;
}
async function saveInfo(){
  const w=normPhone($('#iw').value);if(!w){toast('اكتب رقم واتساب صحيح');return}
  if(!$('#in').value.trim()){toast('اكتب اسم المصنع');return}
  const r=await sb.from('factories').update({name:$('#in').value.trim(),city:$('#ic').value.trim(),whatsapp:w,descr:$('#id').value.trim()}).eq('id',myFactory.id);
  if(r.error){toast(errMsg(r.error));return}
  toast('اتحفظ ✔');await reload();
}
function productModal(id){
  const p=id?S.products.find(x=>x.id===id):{name:'',cat:'',descr:'',sizes:'',colors:'',imgs:[],tiers:[{min:50,price:0}],sold_out:false,hidden:false};
  tmp.imgs=[...(p.imgs||[])];
  const help=ownerWa('السلام عليكم، عايز مساعدة في تحديد أسعار الجملة لموديلاتي');
  modal(`<button class="x" onclick="closeM()" aria-label="إغلاق">✕</button><h2 style="margin-top:0">${id?'تعديل موديل':'موديل جديد'}</h2>
  <label class="f">الصور (الأولى هي الرئيسية)</label><div class="imgs" id="imgs">${imgsHTML()}</div>
  <div class="row"><div><label class="f" for="pn">اسم الموديل</label><input id="pn" value="${esc(p.name)}"></div><div><label class="f" for="pc">القسم</label><input id="pc" value="${esc(p.cat)}" placeholder="جينز أولادي"></div></div>
  <label class="f" for="pd">وصف</label><textarea id="pd">${esc(p.descr)}</textarea>
  <div class="row"><div><label class="f" for="ps">المقاسات (بينها فاصلة)</label><input id="ps" value="${esc(p.sizes)}" placeholder="32, 34, 36"></div><div><label class="f" for="pcl">الألوان (بينها فاصلة)</label><input id="pcl" value="${esc(p.colors)}"></div></div>
  <label class="f" for="pt" style="display:flex;align-items:center;gap:8px">أسعار الجملة (الكمية:السعر) <button class="qbtn" type="button" onclick="$('#thelp').hidden=!$('#thelp').hidden" aria-label="شرح الأسعار">؟</button></label>
  <input id="pt" value="${(p.tiers||[]).map(t=>t.min+':'+t.price).join(', ')}" placeholder="50:260, 200:245, 500:230">
  <div class="qhelp" id="thelp" hidden>اكتب كل شريحة بالشكل <b>الكمية:السعر</b> وافصل بينهم بفاصلة. مثال: <b>50:260, 200:245</b> يعني من 50 قطعة السعر 260، ومن 200 قطعة السعر 245.${help?`<div class="bar"><a class="btn g sm" target="_blank" rel="noopener" href="${help}">اسأل الإدارة عن الأسعار</a></div>`:''}</div>
  <label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="po" style="width:auto" ${p.sold_out?'checked':''}> خلصان (غير متاح)</label>
  <label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ph2" style="width:auto" ${p.hidden?'checked':''}> إخفاء من المتجر</label>
  <div class="bar"><button class="btn" id="psave" onclick="saveProduct('${id||''}')">حفظ</button><button class="btn s" onclick="closeM()">إلغاء</button></div>`);
}
function parseTiers(s){return s.split(/[,،\n]/).map(x=>x.trim()).filter(Boolean).map(x=>{const [a,b]=x.split(':');return {min:+a,price:+b}}).filter(t=>t.min>0&&t.price>0)}
async function saveProduct(id){
  const tiers=parseTiers($('#pt').value);
  if(!$('#pn').value.trim()){toast('اكتب اسم الموديل');return}
  if(!tiers.length){toast('اكتب الأسعار بالشكل 50:260, 200:245');return}
  const o={factory_id:myFactory.id,name:$('#pn').value.trim(),cat:$('#pc').value.trim(),descr:$('#pd').value.trim(),sizes:$('#ps').value.trim(),colors:$('#pcl').value.trim(),imgs:[...tmp.imgs],tiers,sold_out:$('#po').checked,hidden:$('#ph2').checked};
  $('#psave').disabled=true;
  const r=id?await sb.from('products').update(o).eq('id',id):await sb.from('products').insert(o);
  if(r.error){$('#psave').disabled=false;toast(errMsg(r.error));return}
  closeM();toast('اتحفظ ✔');await reload();
}
function delProduct(id){ask('حذف الموديل؟',async()=>{const r=await sb.from('products').delete().eq('id',id);if(r.error)toast(errMsg(r.error));await reload()})}

/* ================= لوحة المالك ================= */
function adminHTML(){
  if(!me)return authHTML('admin');
  if(!isAdmin)return `<div class="panel fbox"><h3>الحساب ده مش حساب إدارة</h3><p class="note">لو ده أول تشغيل للمنصة وإنت المالك، دوس الزرار (بيشتغل مرة واحدة بس لأول حساب).</p>
   <div class="bar"><button class="btn" onclick="claimOwner()">أنا مالك المنصة</button><button class="btn s" onclick="logout()">خروج</button></div></div>`;
  const F=S.factories,act=F.filter(isLive).length,pen=F.filter(f=>f.status==='pending').length;
  const tabs=[['factories','المصانع'],['products','الموديلات'],['settings','إعدادات المنصة']];
  return `<div class="bar" style="justify-content:space-between"><b style="font-size:18px">لوحة الإدارة</b><button class="btn s sm" onclick="logout()">خروج</button></div>
  <div class="stats"><div><b>${F.length}</b><span>مصنع</span></div><div><b>${act}</b><span>اشتراك شغال</span></div><div><b>${pen}</b><span>مستني تفعيل</span></div><div><b>${S.products.length}</b><span>موديل</span></div></div>
  <div class="tabs">${tabs.map(t=>`<button class="tab ${atab===t[0]?'on':''}" onclick="atab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
  ${atab==='factories'?adminFactories():atab==='products'?adminProducts():adminSettings()}`;
}
async function claimOwner(){
  const r=await sb.from('admins').insert({user_id:me.id});
  if(r.error){toast('فيه مالك متسجّل قبل كده');return}
  toast('تم ✔');await reload();
}
function stChip(f){
  if(f.status==='blocked')return '<span class="st bad">موقوف</span>';
  if(f.status==='pending')return '<span class="st warn">مستني التفعيل</span>';
  return isLive(f)?`<span class="st ok">شغال لحد ${esc(f.paid_until)}</span>`:'<span class="st bad">منتهي</span>';
}
function adminFactories(){
  if(!S.factories.length)return '<div class="empty">لسه مفيش مصانع سجّلت</div>';
  const order={pending:0,active:1,blocked:2};
  return [...S.factories].sort((a,b)=>order[a.status]-order[b.status]).map(f=>{
    const n=S.products.filter(p=>p.factory_id===f.id).length;
    return `<div class="panel"><div class="bar" style="margin:0 0 6px;justify-content:space-between"><b>${esc(f.name)}</b>${stChip(f)}</div>
    <div class="note">${esc(f.city)} • ${esc(f.phone)} • ${n} موديل</div>
    <div class="bar"><select id="m_${f.id}" style="width:auto"><option value="1">شهر</option><option value="3">3 شهور</option><option value="6">6 شهور</option><option value="12">سنة</option></select>
    <button class="btn sm" onclick="activate('${f.id}')">${f.status==='pending'?'تفعيل':'تجديد'}</button>
    <button class="btn s sm" onclick="setFac('${f.id}',{status:'${f.status==='blocked'?'active':'blocked'}'})">${f.status==='blocked'?'فك الإيقاف':'إيقاف'}</button>
    <button class="btn s sm" onclick="setFac('${f.id}',{verified:${!f.verified}})">${f.verified?'إلغاء التوثيق':'توثيق ✔'}</button>
    <a class="btn s sm" target="_blank" rel="noopener" href="${waTo(f.whatsapp||f.phone,'السلام عليكم، من إدارة '+S.settings.name)}">واتساب</a>
    <button class="btn d sm" onclick="delFactory('${f.id}')">حذف</button></div></div>`;
  }).join('');
}
async function setFac(id,patch){const r=await sb.from('factories').update(patch).eq('id',id);if(r.error)toast(errMsg(r.error));await reload()}
async function activate(id){
  const f=S.factories.find(x=>x.id===id),m=+$('#m_'+id).value;
  const d=new Date(Math.max(Date.now(),f.paid_until?new Date(f.paid_until).getTime():0));
  d.setMonth(d.getMonth()+m);
  await setFac(id,{status:'active',paid_until:d.toISOString().slice(0,10)});
  toast('تم التفعيل ✔');
}
function delFactory(id){ask('حذف المصنع وكل موديلاته؟',async()=>{const r=await sb.from('factories').delete().eq('id',id);if(r.error)toast(errMsg(r.error));await reload()})}
function adminProducts(){
  if(!S.products.length)return '<div class="empty">لسه مفيش موديلات</div>';
  return S.products.map(p=>`<div class="item" style="${p.hidden?'opacity:.55':''}"><div class="t">${p.imgs&&p.imgs[0]?`<img src="${esc(p.imgs[0])}" alt="">`:'👖'}</div>
  <div class="m"><b>${esc(p.name)}</b><small>${esc(fac(p.factory_id).name)} • من ${minPrice(p)} ج${p.hidden?' • مخفي':''}</small></div>
  <div class="ac"><button class="btn s sm" onclick="togProd('${p.id}',${!p.hidden})">${p.hidden?'إظهار':'إخفاء'}</button><button class="btn d sm" onclick="admDelProd('${p.id}')">حذف</button></div></div>`).join('');
}
async function togProd(id,h){const r=await sb.from('products').update({hidden:h}).eq('id',id);if(r.error)toast(errMsg(r.error));await reload()}
function admDelProd(id){ask('حذف الموديل؟',async()=>{const r=await sb.from('products').delete().eq('id',id);if(r.error)toast(errMsg(r.error));await reload()})}
const COLORS=['#1f4e8c','#0f766e','#b45309','#9f1239','#4c1d95','#111827'];
function adminSettings(){
  const s=S.settings;tmp.logo=s.logo;tmp.cover=s.cover;
  return `<div class="panel"><label class="f" for="sn">اسم المنصة</label><input id="sn" value="${esc(s.name)}">
  <label class="f" for="st">الجملة اللي تحت الاسم</label><input id="st" value="${esc(s.tagline)}">
  <label class="f" for="sw">رقم واتساب الإدارة (للاشتراكات والمساعدة)</label><input id="sw" inputmode="tel" value="${esc(s.owner_whatsapp)}" placeholder="01xxxxxxxxx">
  <label class="f" for="sp">سعر الاشتراك (بيظهر للمصانع)</label><input id="sp" value="${esc(s.sub_price)}" placeholder="مثال: الاشتراك الشهري 300 جنيه">
  <label class="f" for="sno">طريقة الدفع (بتظهر للمصانع)</label><textarea id="sno">${esc(s.sub_note)}</textarea>
  <label class="f">لون المنصة</label><div class="sw">${COLORS.map(c=>`<i style="background:${c}" class="${s.color===c?'on':''}" onclick="setColor('${c}',this)"></i>`).join('')}</div>
  <label class="f">اللوجو</label><div class="imgs"><div id="logoPrev">${prevHTML('logo')}</div><label class="addimg">اختار لوجو<input type="file" accept="image/*" onchange="pickOne(this,'logo')"></label></div>
  <label class="f">صورة الغلاف (اختياري)</label><div class="imgs"><div id="coverPrev">${prevHTML('cover')}</div><label class="addimg">اختار غلاف<input type="file" accept="image/*" onchange="pickOne(this,'cover')"></label></div>
  <div class="bar"><button class="btn" onclick="saveSettings()">حفظ</button></div></div>`;
}
function prevHTML(k){return tmp[k]?`<div class="th"><img src="${esc(tmp[k])}" alt=""><div class="thb"><span></span><button type="button" onclick="tmp.${k}='';$('#${k}Prev').innerHTML=''">✕</button></div></div>`:''}
async function pickOne(inp,k){
  const f=inp.files[0];inp.value='';if(!f)return;
  toast('جاري رفع الصورة...',8000);
  const u=await upImage(f,k==='logo'?400:1600,.82,k==='logo'?'image/png':'image/jpeg');
  if(u){tmp[k]=u;const el=$('#'+k+'Prev');if(el)el.innerHTML=prevHTML(k);toast('تم الرفع. دوس حفظ')}
}
function setColor(c,el){S.settings.color=c;document.documentElement.style.setProperty('--ac',c);el.parentNode.querySelectorAll('i').forEach(i=>i.classList.remove('on'));el.classList.add('on')}
async function saveSettings(){
  const w=$('#sw').value.trim(),nw=w?normPhone(w):'';
  if(w&&!nw){toast('رقم الواتساب غلط');return}
  const o={name:$('#sn').value.trim()||'جملة دايركت',tagline:$('#st').value.trim(),owner_whatsapp:nw,sub_price:$('#sp').value.trim(),sub_note:$('#sno').value.trim(),color:S.settings.color,logo:tmp.logo,cover:tmp.cover};
  const r=await sb.from('settings').update(o).eq('id',1);
  if(r.error){toast(errMsg(r.error));return}
  toast('اتحفظ ✔');await reload();
}

/* ================= صفحة الإعداد (أول مرة) ================= */
function setupHTML(){
  return `<div class="panel fbox" style="max-width:640px"><h2>إعداد المنصة (مرة واحدة)</h2>
  <p class="note">المنصة محتاجة قاعدة بيانات مجانية عشان المصانع والتجار يشوفوا نفس البيانات. أسماء القوايم في Supabase ممكن تتغير شوية، اختار الأقرب.</p>
  <ol class="steps">
   <li>اعمل حساب مجاني على <b>supabase.com</b> وأنشئ <b>New project</b>. استنى دقيقتين لحد ما يجهز.</li>
   <li>افتح <b>SQL Editor</b> ← <b>New query</b>، ودوس الزرار ده والصق الكود واضغط <b>Run</b>:
     <div class="bar"><button class="btn s sm" onclick="copySQL()">نسخ كود الإعداد</button></div>
     <textarea class="sqlbox" readonly onclick="this.select()">${esc(SQL)}</textarea></li>
   <li>افتح <b>Authentication</b> ← <b>Sign In / Providers</b> ← <b>Email</b>، واقفل خيار <b>Confirm email</b> واحفظ.</li>
   <li>افتح <b>Project Settings</b> ← <b>API</b>، وانسخ <b>Project URL</b> و <b>anon public key</b> (لو فيه تبويب Legacy API keys خد الـ anon اللي بيبدأ بـ eyJ) والصقهم هنا:
     <label class="f" for="cu">Project URL</label><input id="cu" dir="ltr" value="${esc(CFG.url)}" placeholder="https://xxxx.supabase.co">
     <label class="f" for="ck">anon public key</label><input id="ck" dir="ltr" value="${esc(CFG.key)}" placeholder="eyJ...">
     <div class="bar"><button class="btn" onclick="bakeFile()">حمّل ملف المنصة الجاهز</button></div></li>
   <li>ارفع الملف اللي نزل (اسمه index.html) على استضافة مجانية (Netlify Drop أو GitHub Pages) وخد الرابط.</li>
   <li>افتح <b>الرابط/#admin</b> واعمل حساب المالك: سجّل مصنع جديد برقمك من بوابة المصانع، وبعدين ادخل صفحة <b>#admin</b> ودوس "أنا مالك المنصة". اعمل ده قبل ما تبعت الرابط لأي حد.</li>
  </ol></div>`;
}
function copySQL(){
  const done=()=>toast('اتنسخ. الصقه في SQL Editor');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(SQL).then(done,()=>{const t=document.querySelector('.sqlbox');t.select();document.execCommand('copy');done()})}
  else{const t=document.querySelector('.sqlbox');t.select();document.execCommand('copy');done()}
}
function bakeFile(){
  const url=$('#cu').value.trim().replace(/\/+$/,''),key=$('#ck').value.trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){toast('الرابط لازم يبقى زي https://xxxx.supabase.co');return}
  if(key.length<30){toast('الصق الـ anon public key كامل');return}
  const cfg=JSON.stringify({url,key}).replace(/</g,'\\u003c');
  const html=SRC.replace(/(<script type="application\/json" id="cfg">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+cfg+b);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';
  document.body.appendChild(a);a.click();a.remove();toast('نزل ملف index.html. ارفعه على الاستضافة');
}

/* ================= تشغيل ================= */
(async function boot(){
  if(!CFG.url||!CFG.key||route()==='setup'){render();return}
  if(!window.supabase||!supabase.createClient){$('#app').innerHTML='<div class="panel fbox"><h3>مفيش اتصال بالإنترنت</h3><p class="note">اتأكد من النت وحدّث الصفحة.</p></div>';return}
  sb=supabase.createClient(CFG.url,CFG.key);
  $('#app').innerHTML='<div class="empty">جاري التحميل...</div>';
  try{await loadData();await refreshAuth()}catch(e){loadErr=errMsg(e)}
  render();
})();
</script>
</body>
</html>
