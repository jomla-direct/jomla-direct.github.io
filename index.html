<style>
/* منصة جملة: متجر للتجار + بوابة للمصانع + إدارة للمالك */
:root{--ac:#1f4e8c;--act:#1f4e8c;--bg:#f4f2ed;--card:#ffffff;--tx:#18222e;--mu:#667284;--br:#e4e0d6;--soft:#e6ecf4;--wa:#25d366;--wa-tx:#053a1c;--bad:#d93a40;--ok:#1d8a4f;--warn:#b7791f;--font:'Cairo',Tahoma,'Segoe UI',sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--act:color-mix(in srgb,var(--ac) 45%,#ffffff);--bg:#0f151d;--card:#18212c;--tx:#edf1f6;--mu:#95a1b2;--br:#2a3542;--soft:#223044;--ok:#4cc38a;--warn:#e0a94a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;font-family:var(--font);font-size:15px;background:var(--bg);color:var(--tx);line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:15px}
a{color:inherit}
.hd{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:18px;min-width:0}
.brand img{width:38px;height:38px;object-fit:contain;border-radius:8px}
.brand b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{display:flex;align-items:center;gap:6px;background:var(--soft);color:var(--tx);border:0;border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:600;text-decoration:none;flex:none;font-size:14px}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1100px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 100px max(16px,env(safe-area-inset-left,0px))}
.hero{border-radius:20px;padding:34px 20px;color:#fff;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));background-size:cover;background-position:center;margin-bottom:14px}
.hero h1{margin:0 0 6px;font-size:28px;line-height:1.25;text-wrap:balance}
.hero p{margin:0 0 16px;opacity:.92;max-width:520px}
.search{width:100%;max-width:460px;border:0;border-radius:14px;padding:13px 16px;background:var(--card);color:var(--tx);box-shadow:0 4px 18px #0003}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--br);background:var(--card);border-radius:20px;padding:7px 16px;cursor:pointer;color:var(--tx)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.hero h1{font-size:34px}}
@media(min-width:980px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--br);display:flex;flex-direction:column}
.pic{position:relative;aspect-ratio:var(--ratio,4/5);background:var(--picbg,var(--soft));display:flex;align-items:center;justify-content:center;font-size:64px;cursor:pointer;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:var(--fit,cover)}
.tag{position:absolute;top:8px;right:8px;background:#000a;color:#fff;font-size:12px;border-radius:12px;padding:2px 10px}
.tag.out{background:var(--bad)}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.cb h3{margin:0;font-size:15px;line-height:1.35;cursor:pointer}
.fn{font-size:12px;color:var(--mu)}
.pr{font-size:17px;font-weight:800;color:var(--act);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ptxt{font-size:13px;font-weight:700;color:var(--tx);line-height:1.5}
.pr small{font-weight:400;color:var(--mu);font-size:12px}
.qbtn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--act);color:var(--act);background:transparent;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;text-decoration:none;cursor:pointer;padding:0;flex:none;line-height:1}
.wa{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--wa);color:var(--wa-tx);text-decoration:none;border:0;border-radius:12px;padding:10px;font-weight:800;cursor:pointer;margin-top:auto}
.wa.big{padding:14px;font-size:17px;border-radius:14px}
.wa.off{background:var(--br);color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.mbg{position:fixed;inset:0;background:#000b;z-index:60;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:14px}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:520px;margin:auto;padding:16px;position:relative}
.x{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--tx);cursor:pointer;font-size:16px;z-index:2}
.gmain{aspect-ratio:var(--ratio,1/1);border-radius:14px;background:var(--picbg,var(--soft));display:flex;align-items:center;justify-content:center;font-size:90px;overflow:hidden}
.gmain img{width:100%;height:100%;object-fit:var(--fit,cover)}
.thumbs{display:flex;gap:8px;margin:8px 0;overflow-x:auto}
.thumbs img{width:58px;height:58px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer;flex:none}
.thumbs img.on{border-color:var(--ac)}
.modal h2{margin:10px 0 2px;font-size:20px}
.lbl{font-size:13px;color:var(--mu);margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:10px;padding:7px 14px;cursor:pointer}
.opt.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--act);font-weight:800}
.tiers{background:var(--bg);border-radius:12px;padding:8px 12px;font-size:14px}
.tiers div{display:flex;justify-content:space-between;padding:2px 0}
.qhelp{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.pl{margin:10px 0;font-weight:800;color:var(--act);min-height:24px}
input,select,textarea{width:100%;border:1px solid var(--br);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--tx)}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.row{grid-template-columns:1fr}}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.s{background:var(--soft);color:var(--tx);font-weight:400}
.btn.d{background:var(--bad)}
.btn.g{background:var(--wa);color:var(--wa-tx);font-weight:800}
.btn.sm{padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tab{flex:none;border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 16px;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.item{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--br);border-radius:14px;padding:8px;margin-bottom:8px}
.item .t{width:58px;height:58px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;flex:none}
.item .t img{width:100%;height:100%;object-fit:cover}
.item .m{flex:1;min-width:0}
.item .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m small{color:var(--mu)}
.item .ac{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:190px}
.panel{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:14px;margin-bottom:12px}
.panel h2,.panel h3{margin:0 0 8px}
.fbox{max-width:460px;margin:20px auto}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--br)}
.th img{width:100%;height:100%;object-fit:cover}
.thb{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;background:#000a;padding:2px 4px}
.thb button,.thb span{background:none;border:0;color:#fff;font-size:11px;cursor:pointer}
.addimg{width:84px;height:84px;border-radius:12px;border:2px dashed var(--br);display:flex;align-items:center;justify-content:center;color:var(--mu);cursor:pointer;text-align:center;font-size:13px;position:relative;overflow:hidden}
.addimg input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0;border:0}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid var(--card);box-shadow:0 0 0 1px var(--br)}
.sw i.on{box-shadow:0 0 0 3px var(--tx)}
.st{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:600;background:var(--soft)}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}
.banner{border-radius:14px;padding:12px 14px;margin-bottom:12px;background:var(--soft)}
.banner.warn{border:1px solid var(--warn)}.banner.ok{border:1px solid var(--ok)}.banner.bad{border:1px solid var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--act)}
.stats span{font-size:12px;color:var(--mu)}
#toast{position:fixed;bottom:calc(30px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#18222e;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;display:none;max-width:90%;text-align:center}
.note{font-size:13px;color:var(--mu)}
.steps{margin:8px 0 0;padding-right:20px}.steps li{margin-bottom:10px}
.sqlbox{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:12px;height:140px}
.intro{position:fixed;inset:0;z-index:70;overflow:auto;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(160deg,var(--ac),color-mix(in srgb,var(--ac) 45%,#000));background-size:cover;background-position:center;padding:24px max(20px,env(safe-area-inset-right,0px));animation:introIn .5s ease both}
@keyframes introIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.intro{animation:none}}
.intro-in{width:100%;max-width:440px;text-align:center}
.intro-logo{width:84px;height:84px;margin:0 auto 14px;border-radius:22px;background:#ffffff26;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden}
.intro-logo img{width:100%;height:100%;object-fit:contain}
.intro-kick{font-size:13px;opacity:.85;margin-bottom:6px}
.intro h1{margin:0 0 8px;font-size:34px;line-height:1.2;text-wrap:balance}
.intro p{margin:0 auto 22px;opacity:.92;max-width:360px}
.intro-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:20px}
.intro-stats div{background:#ffffff1f;border:1px solid #ffffff33;border-radius:14px;padding:12px 6px}
.intro-stats b{display:block;font-size:22px;line-height:1.2}
.intro-stats span{font-size:12px;opacity:.9}
.intro-go{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800;background:#fff;color:#18222e;cursor:pointer}

.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.perk{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:10px 6px;text-align:center;font-size:12.5px;font-weight:700;line-height:1.35}
.perk svg{display:block;margin:0 auto 5px;width:24px;height:24px;fill:none;stroke:var(--act);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.how{margin-top:30px;background:var(--card);border:1px solid var(--br);border-radius:18px;padding:18px 16px}
.how h2{margin:0 0 12px;font-size:18px}
.step{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.step i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800}
.step b{display:block}.step span{color:var(--mu);font-size:13.5px}
.cta{margin-top:14px;border-radius:18px;padding:18px 16px;color:#fff;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cta b{font-size:17px;display:block}.cta span{opacity:.9;font-size:13.5px}
.cta a{background:#fff;color:#18222e;text-decoration:none;font-weight:800;border-radius:12px;padding:10px 18px;flex:none}
.fab{position:fixed;bottom:18px;left:16px;z-index:40;display:flex;align-items:center;gap:8px;background:var(--wa);color:var(--wa-tx);text-decoration:none;font-weight:800;border-radius:28px;padding:12px 18px;box-shadow:0 6px 20px #0004}
.card{transition:transform .15s,box-shadow .15s}
@media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0002}}

.tag.new{right:auto;left:8px;background:var(--ac)}
.sorts{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:0 2px 10px;font-size:13px;color:var(--mu);scrollbar-width:none}
.sorts button{flex:none;border:0;background:transparent;color:var(--mu);padding:5px 10px;border-radius:14px;cursor:pointer}
.sorts button.on{background:var(--soft);color:var(--tx);font-weight:700}
.fcard{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:14px;margin-bottom:12px}
.fcard h2{margin:0 0 2px;font-size:20px}.fcard p{margin:6px 0;color:var(--mu)}
.shr{position:absolute;bottom:8px;left:8px;width:32px;height:32px;border-radius:50%;border:0;background:#000a;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.shr svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.kpis div{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:10px 4px;text-align:center}
.kpis b{display:block;font-size:20px;color:var(--act)}.kpis span{font-size:11.5px;color:var(--mu)}
.mini{font-size:12px;color:var(--mu)}
.inst{background:transparent;border:1px dashed var(--br);color:var(--mu);border-radius:12px;padding:9px 14px;cursor:pointer;margin-top:10px;width:100%}

.flg{width:18px;height:18px;border-radius:50%;object-fit:cover;vertical-align:-4px;margin-left:5px;background:var(--soft)}
.fhead{display:flex;gap:12px;align-items:center}.fhead img{width:60px;height:60px;border-radius:14px;object-fit:cover;background:var(--soft);flex:none}
.lookbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.watm{position:absolute;bottom:6px;right:6px;background:#0008;color:#fff;font-size:10px;border-radius:8px;padding:1px 7px}

/* ===== التصميم الجديد: خيط الجينز ===== */
:root{--st:#e9a23b;--ink:color-mix(in srgb,var(--ac) 28%,#0a1020);--bg:#f0f3f8;--card:#ffffff;--br:#d9e0ec;--soft:#e6ecf5;--tx:#14213a;--mu:#5b6a83}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c1220;--card:#151f35;--br:#26334d;--soft:#1d2a45;--tx:#e9eef7;--mu:#93a1ba;--ink:color-mix(in srgb,var(--ac) 22%,#070b14)}}
#hdr{position:sticky;top:0;z-index:30}

.hero p{margin:0 0 12px;font-size:14px;opacity:.92}
.hstats{display:flex;gap:16px;margin-top:12px;font-size:12.5px;flex-wrap:wrap}

.chips{position:sticky;top:calc(var(--hh,58px) - 1px);z-index:20;background:var(--bg);margin:0 -2px;padding:8px 2px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.vt{font-size:20px;font-weight:900;margin:6px 2px 12px}
.card{border-radius:14px}

.acts{display:flex;gap:6px;margin-top:auto}

.cbtn{width:44px;border-radius:12px;border:1.5px solid var(--br);background:var(--card);color:var(--tx);font-size:22px;font-weight:700;cursor:pointer;padding:0}

.tag.new{left:auto;right:8px;top:auto;bottom:8px;background:var(--st);color:#1a1205;font-weight:800}

async function toBlob(file,max,q,type){
  try{
    let bmp=null;
    if(window.createImageBitmap){try{bmp=await createImageBitmap(file)}catch(e){bmp=null}}
    if(!bmp)bmp=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('decode'));im.src=u});
    const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,k=Math.min(1,max/Math.max(w,h));
    const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b),type||'image/jpeg',q));
  }catch(e){
    if(/^image\/(jpeg|png|webp|gif)$/.test(file.type)&&file.size<10*1024*1024)return file;
    return null;
  }
}
async function upImage(file,max,q,type,std){
  if(!me){toast('سجّل دخول الأول');return null}
  let blob=null;
  if(std){try{blob=await toStd(file)}catch(e){blob=null}}
  if(!blob)blob=await toBlob(file,max,q,type);
  if(!blob){toast('الصورة دي مش مدعومة. جرب JPG أو PNG');return null}
  const ext=blob.type==='image/png'?'png':'jpg';
  const path=`${me.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const r=await sb.storage.from('media').upload(path,blob,{contentType:blob.type||'image/jpeg',upsert:false});
  if(r.error){
    console.warn('storage upload failed',r.error);
    try{
      const small=await toBlob(file,Math.min(max,type==='image/png'?400:900),.7,type);
      if(small&&small.size<700*1024){
        return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(small)});
      }
    }catch(e){}
    toast('رفع الصورة فشل: '+errMsg(r.error));return null;
  }
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}

async function doLogin(who){
  const ph=normPhone($('#ph').value),pw=$('#pw').value;
  if(!ph){toast('اكتب رقم موبايل صحيح (01xxxxxxxxx)');return}
  if(!pw){toast('اكتب كلمة السر');return}
  const b=$('#authbtn');b.disabled=true;
  const r=await sb.auth.signInWithPassword({email:emailOf(ph),password:pw});
  b.disabled=false;
  if(r.error){toast(errMsg(r.error));return}
  await reload();
}
async function doRegister(){
  const ph=normPhone($('#ph').value),pw=$('#pw').value,name=$('#rn').value.trim();
  if(!name){toast('اكتب اسم المصنع');return}
  if(!ph){toast('اكتب رقم موبايل صحيح (01xxxxxxxxx)');return}
  if(pw.length<6){toast('كلمة السر لازم تكون 6 حروف أو أرقام على الأقل');return}
  const b=$('#authbtn');b.disabled=true;
  let r=await sb.auth.signUp({email:emailOf(ph),password:pw});
  if(r.error&&/already registered|already exists/i.test(r.error.message||'')){
    const li=await sb.auth.signInWithPassword({email:emailOf(ph),password:pw});
    if(li.error){b.disabled=false;toast('الرقم ده مسجّل قبل كده بكلمة سر تانية. اعمل تسجيل دخول بالكلمة الصح');return}
    const ex=await sb.from('factories').select('id').eq('id',(li.data.user||li.data.session.user).id).maybeSingle();
    if(ex.data){b.disabled=false;toast('المصنع ده مسجّل قبل كده. اعمل تسجيل دخول');await reload();return}
    r={data:{user:(li.data.user||li.data.session.user),session:li.data.session}};
  }
  if(r.error){b.disabled=false;toast(errMsg(r.error));return}
  if(!r.data||!r.data.session){b.disabled=false;toast('لازم صاحب المنصة يقفل "Confirm email" من إعدادات Supabase',7000);return}
  const ins=await sb.from('factories').insert({id:r.data.user.id,phone:ph,name,city:$('#rc').value.trim(),descr:$('#rd').value.trim(),whatsapp:ph});
  b.disabled=false;
  if(ins.error){toast(errMsg(ins.error));return}
  authMode='login';toast('تم تسجيل مصنعك ✔');
  await reload();
}
async function completeFactory(){
  const name=$('#rn').value.trim();if(!name){toast('اكتب اسم المصنع');return}
  const ph=String((me.email||'').split('@')[0]);
  const b=$('#authbtn');b.disabled=true;

}

async function doTraderRegister(){
 const ph=normPhone($('#ph').value),pw=$('#pw').value,name=$('#tn').value.trim();
 if(!name){toast('اكتب اسمك');return}
 if(!ph){toast('اكتب رقم موبايل صحيح (01xxxxxxxxx)');return}
 if(pw.length<6){toast('كلمة السر لازم تكون 6 حروف أو أرقام على الأقل');return}
 const b=$('#authbtn');b.disabled=true;
 let r=await sb.auth.signUp({email:emailOf(ph),password:pw});
 if(r.error&&/already registered|already exists/i.test(r.error.message||'')){
  const li=await sb.auth.signInWithPassword({email:emailOf(ph),password:pw});
  if(li.error){b.disabled=false;toast('الرقم ده مسجّل قبل كده بكلمة سر تانية');return}
  const u=li.data.user||li.data.session.user;
  const ex=await sb.from('factories').select('id').eq('id',u.id).maybeSingle();
  if(ex.data){b.disabled=false;toast('الرقم ده مسجّل كمصنع. استخدم رقم تاني للتاجر أو ادخل من بوابة المصانع');await sb.auth.signOut();return}
  const et=await sb.from('traders').select('id').eq('id',u.id).maybeSingle();
  if(et.data){b.disabled=false;toast('الحساب موجود. اعمل دخول');await reload();return}
  r={data:{user:u,session:li.data.session}};
 }
 if(r.error){b.disabled=false;toast(errMsg(r.error));return}
 if(!r.data||!r.data.session){b.disabled=false;toast('لازم صاحب المنصة يقفل "Confirm email" من إعدادات Supabase',7000);return}
 const ins=await sb.from('traders').insert({id:r.data.user.id,name,phone:ph});
 b.disabled=false;if(ins.error){toast(errMsg(ins.error));return}
 authMode='login';toast('تم إنشاء حسابك ✔');await reload();
}

async function toStd(file){
  const l=lookOf(),[rw,rh]=l.ratio.split('/').map(Number),W=1000,H=Math.round(W*rh/rw);
  let bmp=null;
  if(window.createImageBitmap){try{bmp=await createImageBitmap(file)}catch(e){bmp=null}}
  if(!bmp)bmp=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('decode'));im.src=u});
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle=l.fit==='contain'?l.bg:'#ffffff';x.fillRect(0,0,W,H);
  const k=l.fit==='contain'?Math.min(W/w,H/h):Math.max(W/w,H/h),dw=w*k,dh=h*k;
  x.drawImage(bmp,(W-dw)/2,(H-dh)/2,dw,dh);
  if(l.mark){
    const t=S.settings.name||'';x.font='700 28px Cairo,Tahoma,sans-serif';
    const tw=x.measureText(t).width+28;x.fillStyle='rgba(0,0,0,.45)';
    x.beginPath();(x.roundRect?x.roundRect(W-tw-16,H-52,tw,36,10):x.rect(W-tw-16,H-52,tw,36));x.fill();
    x.fillStyle='#fff';x.textBaseline='middle';x.fillText(t,W-tw-2,H-34);
  }
  return await new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',.82));
}

const isFav=id=>FAV.includes(id);
const HEART='<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
function dbPaint(){clearTimeout(dbT);dbT=setTimeout(paint,160)}
function toggleFav(id,ev){
  if(ev)ev.stopPropagation();
  const i=FAV.indexOf(id);if(i<0)FAV.push(id);else FAV.splice(i,1);saveFav();navUpdate();
  if(filt.view==='favs')paint();else document.querySelectorAll('[data-fav="'+id+'"]').forEach(b=>b.classList.toggle('on',isFav(id)));
}
function goView(v){
  filt.view=v;filt.n=12;
  if(v==='home'){filt.cat='';filt.fac='';filt.q=''}
  if(/^#(f|p)=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search);
  render();
}
function bnavHTML(){
  const v=filt.view||'home',ic=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
  const b=(k,label,svg,id)=>`<button type="button" class="${v===k?'on':''}" onclick="goView('${k}')">${svg}${label}${id?`<span class="bdg" id="${id}"></span>`:''}</button>`;
  return b('home','الرئيسية',ic('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'))+
   b('factories','المصانع',ic('<path d="M3 21V9l6 4V9l6 4V5h6v16z"/>'))+
   b('favs','المفضلة',HEART,'nbFav')+
   `<button type="button" onclick="openCart()">${ic('<path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/>')}طلبي<span class="bdg" id="nbCart"></span></button>`;
}
function navUpdate(){
  const f=$('#nbFav'),c=$('#nbCart');
  if(f)f.textContent=FAV.length||'';
  if(c)c.textContent=cartCount()||'';
}
function cartLines(){return CART.map((c,i)=>({c,i,p:S.products.find(x=>x.id===c.id)})).filter(x=>x.p&&!x.p.sold_out&&isLive(fac(x.p.factory_id)))}
const cartCount=()=>cartLines().length;
function addCart(id,o){
  const p=S.products.find(x=>x.id===id);if(!p)return;
  o=o||{};const q=Math.max(1,Math.floor(+o.qty)||minQty(p)),size=o.size||'',color=o.color||'';
  const ex=CART.find(c=>c.id===id&&c.size===size&&c.color===color);
  if(ex)ex.qty=(+ex.qty||0)+q;else CART.push({id,size,color,qty:q});
  saveCart();navUpdate();toast('اتضاف لقائمة الطلب ✔');
}
function cartQty(i,d){const c=CART[i];if(!c)return;const p=S.products.find(x=>x.id===c.id),mn=p?minQty(p):1;c.qty=Math.max(mn,(+c.qty||mn)+d);saveCart();openCart()}
function cartDel(i){CART.splice(i,1);saveCart();navUpdate();openCart()}
function cartClear(fid){CART=CART.filter(c=>{const p=S.products.find(x=>x.id===c.id);return !(p&&p.factory_id===fid)});saveCart();navUpdate();openCart()}
function cartTrack(fid){const ls2=cartLines().filter(x=>x.p.factory_id===fid);ls2.forEach(x=>tk('order',x.p.id));recInqFac(fid,'طلب من قائمة الطلب: '+ls2.map(x=>x.p.name).join('، '))}
function cartURL(fid,g){
  const f=fac(fid);let t=0,all=true;
  let m=`السلام عليكم، عايز أطلب من ${S.settings.name} (${f.name}):`;
  g.forEach((x,n)=>{
    const u=unitPrice(x.p,+x.c.qty);
    m+=`\n${n+1}) ${x.p.name}`+(x.c.size?` | مقاس ${x.c.size}`:'')+(x.c.color?` | ${x.c.color}`:'')+` | الكمية: ${x.c.qty}`+(u!==null?` | ${u} ج للقطعة`:'');
    if(u===null)all=false;else t+=u*x.c.qty;
  });
  if(all&&t)m+=`\nالإجمالي التقريبي: ${money(t)} ج`;
  return waTo(f.whatsapp||f.phone,m);
}
function openCart(){
  const L=cartLines(),groups={};
  L.forEach(x=>{(groups[x.p.factory_id]=groups[x.p.factory_id]||[]).push(x)});
  const html=Object.keys(groups).map(fid=>{
    const f=fac(fid),g=groups[fid];let total=0,all=true;
    const rows=g.map(x=>{
      const u=unitPrice(x.p,+x.c.qty);if(u===null)all=false;else total+=u*x.c.qty;
      const opt=[x.c.size&&'مقاس '+x.c.size,x.c.color].filter(Boolean).map(esc).join(' • ');
      return `<div class="crow"><div class="cth">${x.p.imgs&&x.p.imgs[0]?`<img src="${esc(x.p.imgs[0])}" alt="">`:'👖'}</div>
       <div class="cmid"><b>${esc(x.p.name)}</b>${opt?`<small>${opt}</small>`:''}<small>${u!==null?`${u} ج للقطعة`:esc(noteOf(x.p)||'السعر على واتساب')}</small></div>
       <div class="cq"><button type="button" onclick="cartQty(${x.i},-1)" aria-label="أقل">−</button><b>${x.c.qty}</b><button type="button" onclick="cartQty(${x.i},1)" aria-label="أكثر">+</button></div>
       <button class="cx" type="button" onclick="cartDel(${x.i})" aria-label="حذف">✕</button></div>`;
    }).join('');
    return `<div class="cgrp"><div class="chead"><b>${esc(f.name)}</b>${f.city?`<small>${esc(f.city)}</small>`:''}</div>${rows}
     ${all&&total?`<div class="ctot"><span>الإجمالي التقريبي</span><b>${money(total)} ج</b></div>`:''}
     <div class="bar"><a class="wa big" style="flex:1" target="_blank" rel="noopener" href="${cartURL(fid,g)}" onclick="cartTrack('${fid}')">ابعت الطلب لـ ${esc(f.name)}</a><button class="btn s sm" type="button" onclick="cartClear('${fid}')">مسح</button></div></div>`;
  }).join('');
  modal(`<button class="x" onclick="closeM()" aria-label="إغلاق">✕</button><h2 style="margin:0 0 12px">قائمة الطلب</h2>${html||'<div class="empty">القائمة فاضية.<br>دوس + على أي موديل عشان تضيفه.</div>'}`);
}
function factoriesViewHTML(){
  const lp=liveProducts(),fs=S.factories.filter(f=>isLive(f)&&lp.some(p=>p.factory_id===f.id));
  if(!fs.length)return '<div class="empty">لسه مفيش مصانع. المصانع بتنضم قريب.</div>';
  return '<div class="fgrid">'+fs.map(f=>{
    const n=lp.filter(p=>p.factory_id===f.id).length;
    return `<div class="fcl" role="button" tabindex="0" onclick="openFactory('${f.id}')"><button class="hrt ${FAVF.includes(f.id)?'on':''}" data-favf="${f.id}" type="button" aria-label="مفضلة" onclick="toggleFavF('${f.id}',event)">${HEART}</button><span class="flogo">${f.logo?`<img src="${esc(f.logo)}" alt="" loading="lazy">`:'🏭'}</span><b>${esc(f.name)}${f.verified?' ✔':''}</b><small>${govOf(f)?esc(govOf(f))+' • ':''}${n} موديل</small></div>`;
  }).join('')+'</div>';
}
function footHTML(){
  const s=S.settings;
  return `<section class="how"><h2>إزاي تطلب؟</h2>
   <div class="step"><i>1</i><div><b>اختار الموديل</b><span>تصفّح موديلات المصانع وشوف الصور والأسعار.</span></div></div>
   <div class="step"><i>2</i><div><b>حدد المقاس واللون والكمية</b><span>وضيف أكتر من موديل لقائمة الطلب.</span></div></div>
   <div class="step"><i>3</i><div><b>ابعت الطلب على واتساب</b><span>بتتكلم مع المصنع مباشرة من غير وسيط.</span></div></div>
  </section>
  <section class="cta"><div><b>عندك مصنع؟</b><span>سجّل مصنعك وابدأ تعرض موديلاتك لتجار الجملة.</span></div><a href="#factory">سجّل مصنعك</a></section>
  <button class="inst" type="button" onclick="installApp()">ثبّت المنصة على موبايلك</button>
  ${s.owner_whatsapp?`<a class="fab" href="${ownerWa('السلام عليكم، عايز أستفسر عن '+s.name)}" target="_blank" rel="noopener" aria-label="تواصل معنا"><svg style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.3A8 8 0 1 1 21 12z"/></svg>تواصل معنا</a>`:''}
  <p class="note" style="text-align:center;margin-top:28px"><a href="#admin">دخول الإدارة</a></p>`;
}

/* ===== إحصائيات + مشاركة + ترتيب ===== */
let POP={},EV=[],evErr=false,deepKey='',deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
const since30=()=>new Date(Date.now()-30*864e5).toISOString();
function tk(type,id){
  try{
    if(!sb||isAdmin)return;
    const p=id?S.products.find(x=>x.id===id):null;
    if(p&&myFactory&&myFactory.id===p.factory_id)return;
    const o={type};if(p){o.product_id=p.id;o.factory_id=p.factory_id}
    sb.from('events').insert(o).then(()=>{},()=>{});
  }catch(e){}
}
async function loadEvents(){
  EV=[];evErr=false;
  if(!sb||!(isAdmin||myFactory))return;
  try{
    const r=await sb.from('events').select('type,product_id,factory_id').gte('created_at',since30()).limit(5000);
    if(r.error)evErr=true;else EV=r.data||[];
  }catch(e){evErr=true}
}
function cnt(type,o){o=o||{};return EV.filter(e=>e.type===type&&(!o.p||e.product_id===o.p)&&(!o.f||e.factory_id===o.f)).length}
function shareURL(id){return location.origin+location.pathname+'#'+id}
function shareP(id){
  const p=S.products.find(x=>x.id===id);if(!p)return;
  const f=fac(p.factory_id),url=shareURL('p='+id),text=`${p.name} من ${f.name} على ${S.settings.name}`;
  tk('share',id);
  if(navigator.share){navigator.share({title:text,text,url}).catch(()=>{});return}
  window.open('https://wa.me/?text='+encodeURIComponent(text+'\n'+url),'_blank');
}
function shareF(id){
  const f=fac(id),url=shareURL('f='+id),text=`${f.name} على ${S.settings.name}`;
  if(navigator.share){navigator.share({title:text,text,url}).catch(()=>{});return}
  window.open('https://wa.me/?text='+encodeURIComponent(text+'\n'+url),'_blank');
}
function openFactory(id){filt.view='home';filt.n=12;location.hash='#f='+id}
function setSort(k){filt.sort=k;filt.n=12;const e=$('#sorts');if(e)e.innerHTML=sortHTML();paint()}
function sortHTML(){
  const o=[['new','الأحدث'],['pop','الأكثر طلبًا'],['cheap','الأرخص']];
  const n=activeFilters();
  return `<button class="fbtn" type="button" onclick="openFilters()">تصفية${n?' ('+n+')':''}</button><span>ترتيب:</span>`+o.map(x=>`<button class="${(filt.sort||'new')===x[0]?'on':''}" onclick="setSort('${x[0]}')">${x[1]}</button>`).join('');
}
function facCardHTML(){
  if(!filt.fac)return '';
  const f=fac(filt.fac);if(!f.name)return '';
  const n=liveProducts().filter(p=>p.factory_id===f.id).length;
  const w=waTo(f.whatsapp||f.phone,`السلام عليكم، عايز أستفسر عن موديلات ${f.name} (${S.settings.name})`);
  const loc=[govOf(f),f.address].filter(Boolean).map(esc).join(' • ');
  const sp=list(f.specialties);
  return `<div class="fcard">${f.cover?`<div class="fcover" style="background-image:url('${esc(f.cover)}')"></div>`:''}<div class="fhead">${f.logo?`<img src="${esc(f.logo)}" alt="">`:''}<div><h2>${esc(f.name)} ${f.verified?'<span class="st ok">موثّق ✔</span>':''}</h2>
   <div class="fn">${loc?loc+' • ':''}${n} موديل</div></div></div>${sp.length?`<div class="spc">${sp.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}${f.descr?`<p>${esc(f.descr)}</p>`:''}
   <div class="bar"><a class="wa" style="flex:1;margin:0" target="_blank" rel="noopener" href="${w}" onclick="tk('ask')">كلّم المصنع على واتساب</a>${f.phone?`<a class="btn s" href="tel:${esc(f.phone)}">اتصال</a>`:''}</div>
   <div class="bar"><button class="btn s sm" type="button" data-favf="${f.id}" onclick="toggleFavF('${f.id}',event)">${FAVF.includes(f.id)?'★ في المفضلة':'☆ أضف للمفضلة'}</button><button class="btn s sm" type="button" onclick="shareF('${f.id}')">مشاركة</button><button class="btn s sm" type="button" onclick="openReport('factory','${f.id}')">إبلاغ</button></div></div>`;
}
function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;return}
  toast('من كروم دوس ⋮ فوق، وبعدها "إضافة إلى الشاشة الرئيسية"',7000);
}
function handleDeep(){
  const h=location.hash;if(h===deepKey)return;deepKey=h;
  let m=h.match(/^#p=(.+)$/);
  if(m&&liveProducts().find(p=>p.id===m[1])){enterShop();setTimeout(()=>openProduct(m[1]),50);return}
}
function statsBox(o){
  if(evErr)return '';
  return `<div class="kpis"><div><b>${cnt('view',o)}</b><span>مشاهدة</span></div><div><b>${cnt('order',o)}</b><span>ضغطة اطلب</span></div><div><b>${cnt('ask',o)}</b><span>سؤال عن السعر</span></div><div><b>${cnt('share',o)}</b><span>مشاركة</span></div></div><div class="note" style="text-align:center">آخر 30 يوم</div>`;
}
function adminStats(){
  if(evErr)return `<div class="panel fbox"><h3>الإحصائيات محتاجة تحديث لقاعدة البيانات</h3><p class="note">شغّل كود التحديث (اللي بعتهولك Claude) في Supabase SQL Editor مرة واحدة وبعدها هتشتغل.</p></div>`;
  const vis=cnt('visit');
  const rows=S.products.map(p=>({p,v:cnt('view',{p:p.id}),o:cnt('order',{p:p.id}),a:cnt('ask',{p:p.id})})).sort((x,y)=>(y.o+y.a)*100+y.v-((x.o+x.a)*100+x.v)).slice(0,10);
  const frows=S.factories.map(f=>({f,v:cnt('view',{f:f.id}),o:cnt('order',{f:f.id})+cnt('ask',{f:f.id})})).sort((x,y)=>y.o-x.o||y.v-x.v);
  return `<div class="kpis"><div><b>${vis}</b><span>زيارة</span></div><div><b>${cnt('view')}</b><span>مشاهدة موديل</span></div><div><b>${cnt('order')}</b><span>ضغطة اطلب</span></div><div><b>${cnt('ask')+cnt('share')}</b><span>أسئلة ومشاركات</span></div></div><div class="note" style="text-align:center">آخر 30 يوم</div>
  <h3>أكتر الموديلات طلبًا</h3>${rows.length?rows.map(r=>`<div class="item"><div class="t">${r.p.imgs&&r.p.imgs[0]?`<img src="${esc(r.p.imgs[0])}" alt="">`:'👖'}</div><div class="m"><b>${esc(r.p.name)}</b><small>${esc(fac(r.p.factory_id).name)} • 👁 ${r.v} • 🛒 ${r.o} • ؟ ${r.a}</small></div></div>`).join(''):'<div class="empty">لسه مفيش بيانات</div>'}
  <h3>المصانع</h3>${frows.map(r=>`<div class="item"><div class="m"><b>${esc(r.f.name)}</b><small>👁 ${r.v} مشاهدة • 🛒 ${r.o} طلب/سؤال</small></div></div>`).join('')}`;
}

/* ================= تشغيل ================= */
(async function boot(){
  if(!CFG.url||!CFG.key||route()==='setup'){render();return}
  if(!window.supabase||!supabase.createClient){$('#app').innerHTML='<div class="panel fbox"><h3>مفيش اتصال بالإنترنت</h3><p class="note">اتأكد من النت وحدّث الصفحة.</p></div>';return}
  sb=supabase.createClient(CFG.url,CFG.key);
  $('#app').innerHTML='<div class="sk" style="height:150px;margin-bottom:12px"></div><div class="skg"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';
  try{await loadData();await refreshAuth();await loadReports();await loadEvents()}catch(e){loadErr=errMsg(e)}
  render();
  if(route()==='store'&&!ss.get('jd_v')){ss.set('jd_v','1');tk('visit')}
})();
</script>
